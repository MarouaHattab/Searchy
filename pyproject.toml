[project]
name = "searchy"
version = "0.1.0"
description = "Multimodal scene search with evidence, knowledge graphs, and local embeddings"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "neo4j>=5.28,<6",
  "qdrant-client>=1.14,<2",
]

[project.optional-dependencies]
models = ["sentence-transformers>=5.1,<6", "pillow>=11,<13"]
video = ["faster-whisper>=1.1,<2", "av>=11,<19", "scenedetect>=0.6.7,<0.7", "opencv-python-headless>=4.10,<5"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/searchy"]

[tool.pytest.ini_options]
testpaths = [".local-tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Header"]
